services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: museumai
      POSTGRES_PASSWORD: museumai
      POSTGRES_DB: museumai
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U museumai -d museumai"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://museumai:museumai@db:5432/museumai
      UPLOAD_DIR: uploads
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
